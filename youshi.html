<script>/* 工工四を撮ると鳴る三線 — 読み取りの仕組み（画面なしでも動く部分）

  w: 210, h: 297,

  cols: 7, rows: 12, box: 19, lyric: 5, x0: 21, y0: 40,

/* ---------- 斜めの写真を正面に直す（射影変換） ---------- */

    let p = i; for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
